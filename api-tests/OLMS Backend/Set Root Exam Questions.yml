info:
  name: Set Root Exam Questions
  type: http
  seq: 129
  tags:
    - olms
    - positive
http:
  method: PUT
  url: "{{base_url}}/exams/{{root_exam_id}}/root-questions"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "variant_code": "ROOT",
        "items": [
          {
            "question_id": "{{pool_question_id}}",
            "score": 1
          },
          {
            "question_id": "{{topic_b_question_id}}",
            "score": 1
          }
        ]
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["root_exam_id","pool_question_id","topic_b_question_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("root_questions_set", true);
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.is_root).to.equal(true);
          expect(body.data.variant_code).to.equal("ROOT");
          expect(body.data.items).to.have.lengthOf(2);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: root_exam_id, pool_question_id, topic_b_question_id. Run the collection sequentially with Local environment."
