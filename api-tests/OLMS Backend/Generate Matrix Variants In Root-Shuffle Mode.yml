info:
  name: Generate Matrix Variants In Root-Shuffle Mode
  type: http
  seq: 137
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/exams/{{mat_root_exam_id}}/generate"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "variant_count": 3,
        "variant_code_start": "601",
        "generation_mode": "FROM_ROOT"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["mat_root_exam_id","mat_root_drafted"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 201 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(201);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.status).to.equal("GENERATED");
          expect(body.data.generation_mode).to.equal("FROM_ROOT");
          expect(body.data.root_variant.variant_code).to.equal("ROOT");
          expect(body.data.variants).to.have.lengthOf(4);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 201. Requires runtime variables: mat_root_exam_id, mat_root_drafted. Run the collection sequentially with Local environment."
