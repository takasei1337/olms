info:
  name: Reject Autosave After Submit
  type: http
  seq: 90
  tags:
    - olms
    - negative
http:
  method: PUT
  url: "{{base_url}}/me/submissions/{{submission_id}}/answers/{{evq_id}}"
  auth:
    type: bearer
    token: "{{enrolled_student_token}}"
  body:
    type: json
    data: |-
      {
        "response_kind": "SINGLE_CHOICE",
        "expected_client_sequence": 1,
        "client_sequence": 2,
        "edit_token": "11111111-1111-4111-8111-111111111103",
        "selected_options": [
          "B"
        ]
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["enrolled_student_token","submission_id","evq_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 409 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(409);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(false);
        });

        test("response contract", () => {
          expect(body.code).to.equal("SUBMISSION_LOCKED");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 409. Requires runtime variables: enrolled_student_token, submission_id, evq_id. Run the collection sequentially with Local environment."
