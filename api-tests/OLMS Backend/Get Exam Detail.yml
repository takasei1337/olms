info:
  name: Get Exam Detail
  type: http
  seq: 44
  tags:
    - olms
    - positive
http:
  method: GET
  url: "{{base_url}}/exams/{{exam_id}}"
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing=["exam_id"].filter(key=>!bru.getVar(key));
        if(missing.length){bru.runner.skipRequest();}
    - type: tests
      code: |-
        const body=res.getBody();
        test("HTTP 200 (actual "+res.getStatus()+" "+(body?.code||body?.status||"")+")",()=>{expect(res.getStatus()).to.equal(200);});
        test("response success flag",()=>expect(body.success).to.equal(true));
        test("response contract",()=>{expect(body.data.id).to.equal(bru.getVar("exam_id"));});
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: exam_id. Run the collection sequentially with Local environment."
