info:
  name: Refresh Token
  type: http
  seq: 6
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/auth/refresh"
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.data?.access_token) {
          bru.setVar("token", res.body.data.access_token);
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.expires_in).to.equal(900);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: Expected HTTP 200. Run the collection sequentially with Local environment.
