info:
  name: Delete Chapter
  type: http
  seq: 109
  tags:
    - olms
    - positive
http:
  method: DELETE
  url: "{{base_url}}/chapters/{{cleanup_chapter_id}}"
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["cleanup_chapter_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: cleanup_chapter_id. Run the collection sequentially with Local environment."
