info:
  name: Update Exam
  type: http
  seq: 31

http:
  method: PATCH
  url: http://localhost:3000/api/v1/exams/:examId
  params:
    - name: examId
      value: 1011995d-3179-4667-8ee3-f6a2d6ff1ceb
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Thi Giữa kỳ Cơ sở dữ liệu 2026.1 (Đã cập nhật)",
        "duration_minutes": 75,
        "total_score": 10
      }
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
