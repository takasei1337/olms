info:
  name: Publish Future Exam
  type: http
  seq: 176
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/exams/{{reuse_exam_id}}/publish"
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["reuse_exam_id","reuse_generated"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("future_published", true);
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: reuse_exam_id, reuse_generated. Run the collection sequentially with Local environment."
