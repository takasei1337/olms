info:
  name: Get Audit Logs
  type: http
  seq: 26
  tags:
    - olms
    - positive
http:
  method: GET
  url: "{{base_url}}/audit-logs?entity_name=users&page=1&page_size=20"
  auth:
    type: bearer
    token: "{{admin_token}}"
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["admin_token","user_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data).to.be.an("array");
          expect(body.data.some((row) => row.entity_id === bru.getVar("user_id") && row.action === "USER_PASSWORD_RESET")).to.equal(true);
          expect(body.data[0].old_value).to.equal(undefined);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: admin_token, user_id. Run the collection sequentially with Local environment."
