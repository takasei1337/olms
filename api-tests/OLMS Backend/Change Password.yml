info:
  name: Change Password
  type: http
  seq: 7

http:
  method: PUT
  url: http://localhost:3000/api/v1/auth/password
  body:
    type: json
    data: |-
      {
        "current_password": "Teacher123@",
        "new_password": "Admin123@"
      }
  auth:
    type: bearer
    token: "{{process.env.OLMS_ACCESS_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
