info:
  name: Reset Participant Credentials
  type: http
  seq: 60
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/exams/{{exam_id}}/participants/{{participant_id}}/credentials/reset"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "reason": "Bruno regression credential reset"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing=["exam_id","participant_id"].filter(key=>!bru.getVar(key));
        if(missing.length){bru.runner.skipRequest();}
    - type: tests
      code: |-
        const body=res.getBody();
        test("HTTP 200 (actual "+res.getStatus()+" "+(body?.code||body?.status||"")+")",()=>{expect(res.getStatus()).to.equal(200);});
        test("response success flag",()=>expect(body.success).to.equal(true));
        test("response contract",()=>{expect(body.data.initial_password).to.be.a("string");expect(body.data.username).to.be.a("string");});
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: exam_id, participant_id. Run the collection sequentially with Local environment."
