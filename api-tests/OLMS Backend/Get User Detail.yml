info:
  name: Get User Detail
  type: http
  seq: 9
  tags:
    - olms
    - positive
http:
  method: GET
  url: "{{base_url}}/users/{{user_id}}"
  auth:
    type: bearer
    token: "{{admin_token}}"
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["user_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.id).to.equal(bru.getVar("user_id"));
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: user_id. Run the collection sequentially with Local environment."
