info:
  name: Update Exam Matrix
  type: http
  seq: 47
  tags:
    - olms
    - positive
http:
  method: PUT
  url: "{{base_url}}/exams/{{exam_id}}/matrix"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "rows": [
          {
            "chapter_id": "{{chapter_id}}",
            "lesson_id": "{{lesson_id}}",
            "question_type_id": "{{single_choice_type_id}}",
            "difficulty_level": "EASY",
            "num_questions": 1,
            "score_per_question": 1,
            "max_questions_per_topic": 2
          }
        ]
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing=["exam_id","lesson_id"].filter(key=>!bru.getVar(key));
        if(missing.length){bru.runner.skipRequest();}
    - type: tests
      code: |
        const body=res.getBody();
        test("HTTP 200 (actual "+res.getStatus()+" "+(body?.code||body?.status||"")+")",()=>{expect(res.getStatus()).to.equal(200);});
        test("response success flag",()=>expect(body.success).to.equal(true));
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: exam_id, lesson_id. Run the collection sequentially with Local environment."
