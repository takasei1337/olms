info:
  name: Extend Exam Close Time
  type: http
  seq: 98
  tags:
    - olms
    - positive
http:
  method: PATCH
  url: "{{base_url}}/exams/{{exam_id}}/close-time"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "closes_at": "{{extended_closes_at}}",
        "reason": "Bruno regression extend close time window"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["exam_id","started"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }

        bru.setVar("extended_closes_at", new Date(Date.now() + 93600000).toISOString());
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.id).to.equal(bru.getVar("exam_id"));
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: exam_id, started. Run the collection sequentially with Local environment."
