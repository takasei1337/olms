info:
  name: Enroll Future Exam Student
  type: http
  seq: 178
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/exams/{{reuse_exam_id}}/participants"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "student_code": "{{run_id}}_F",
        "full_name": "Bruno Future Student"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["future_published"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: after-response
      code: if (res.status === 201) { bru.setVar("future_username", res.body.data.username); bru.setVar("future_password", res.body.data.initial_password); }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 201 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(201);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 201. Requires runtime variables: future_published. Run the collection sequentially with Local environment."
