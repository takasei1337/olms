info:
  name: Reject Other Teacher Question Mutation
  type: http
  seq: 184
  tags:
    - olms
    - negative
http:
  method: PATCH
  url: "{{base_url}}/questions/{{pool_question_id}}"
  auth:
    type: bearer
    token: "{{other_teacher_token}}"
  body:
    type: json
    data: |-
      {
        "content": "Must not be saved"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["other_teacher_token","pool_question_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 403 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(403);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(false);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 403. Requires runtime variables: other_teacher_token, pool_question_id. Run the collection sequentially with Local environment."
