info:
  name: End Exam Early
  type: http
  seq: 167
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/exams/{{mt_exam_id}}/end-early"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "reason": "Bruno regression early completion after all submissions"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["mt_exam_id","mt_started"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.status).to.equal("ENDED");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: mt_exam_id, mt_started. Run the collection sequentially with Local environment."
