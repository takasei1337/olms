info:
  name: Reject Self Delete Admin
  type: http
  seq: 28
  tags:
    - olms
    - negative
http:
  method: DELETE
  url: "{{base_url}}/users/{{admin_user_id}}"
  auth:
    type: bearer
    token: "{{admin_token}}"
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["admin_user_id","admin_token"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 409 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(409);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(false);
        });

        test("response contract", () => {
          expect(body.code).to.equal("CANNOT_DELETE_SELF");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 409. Requires runtime variables: admin_user_id, admin_token. Run the collection sequentially with Local environment."
