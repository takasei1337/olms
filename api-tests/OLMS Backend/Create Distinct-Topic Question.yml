info:
  name: Create Distinct-Topic Question
  type: http
  seq: 118
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/questions"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "lesson_id": "{{lesson_id}}",
        "type_id": "{{single_choice_type_id}}",
        "difficulty_level": "EASY",
        "topic_tag": "{{run_id}}_TOPIC_B",
        "content": "Bruno {{run_id}} TOPIC_B: 4 + 5 bằng bao nhiêu?",
        "explanation": "2 + 3 = 5.",
        "requested_status": "ACTIVE",
        "answer_spec": {
          "schema_version": 1,
          "kind": "SINGLE_CHOICE",
          "choices": [
            {
              "id": "0199ac14-a9bc-7001-8000-000000000101",
              "text": "4",
              "order_no": 1,
              "is_correct": false
            },
            {
              "id": "0199ac14-a9bc-7001-8000-000000000102",
              "text": "5",
              "order_no": 2,
              "is_correct": true
            }
          ]
        }
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["lesson_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        if (res.status === 201) {
          const captured = res.body?.data?.["id"];
          if (captured) {
            bru.setVar("topic_b_question_id", captured);
          }
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 201 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(201);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.status).to.equal("ACTIVE");
          expect(body.data.ai_check_status).to.equal("CHECKED");
          expect(body.data.topic_tag).to.include("_TOPIC_B");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 201. Requires runtime variables: lesson_id. Run the collection sequentially with Local environment."
