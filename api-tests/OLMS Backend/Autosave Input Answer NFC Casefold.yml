info:
  name: Autosave Input Answer NFC Casefold
  type: http
  seq: 161
  tags:
    - olms
    - positive
http:
  method: PUT
  url: "{{base_url}}/me/submissions/{{mt_submission_id}}/answers/{{mt_input_evq_id}}"
  auth:
    type: bearer
    token: "{{mt_student_token}}"
  body:
    type: json
    data: |-
      {
        "response_kind": "INPUT",
        "expected_client_sequence": 0,
        "client_sequence": 1,
        "edit_token": "33333333-3333-4333-8333-333333333303",
        "answer_text": "  HÀ   NỘI  "
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["mt_student_token","mt_submission_id","mt_input_evq_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.accepted_sequence).to.equal(1);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: mt_student_token, mt_submission_id, mt_input_evq_id. Run the collection sequentially with Local environment."
