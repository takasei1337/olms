info:
  name: Get Question Types
  type: http
  seq: 24
  tags:
    - olms
    - positive
http:
  method: GET
  url: "{{base_url}}/question-types"
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data).to.be.an("array");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: Expected HTTP 200. Run the collection sequentially with Local environment.
