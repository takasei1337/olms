info:
  name: Create Cleanup Chapter
  type: http
  seq: 160
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/subjects/{{cleanup_subject_id}}/chapters"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "code": "C1",
        "name": "Bruno cleanup chapter",
        "order_no": 1
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["cleanup_subject_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        if (res.status === 201) {
          const captured = res.body?.data?.["id"];
          if (captured) {
            bru.setVar("cleanup_chapter_id", captured);
          }
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 201 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(201);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 201. Requires runtime variables: cleanup_subject_id. Run the collection sequentially with Local environment."
