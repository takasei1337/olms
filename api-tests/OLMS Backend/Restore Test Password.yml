info:
  name: Restore Test Password
  type: http
  seq: 14
  tags:
    - olms
    - positive
http:
  method: PUT
  url: "{{base_url}}/auth/password"
  auth:
    type: bearer
    token: "{{changed_password_token}}"
  body:
    type: json
    data: |-
      {
        "current_password": "{{api_user_new_password}}",
        "new_password": "{{api_user_password}}"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["changed_password_token"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: changed_password_token. Run the collection sequentially with Local environment."
