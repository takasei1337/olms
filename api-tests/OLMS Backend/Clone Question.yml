info:
  name: Clone Question
  type: http
  seq: 35
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/questions/{{question_id}}/clone"
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing=["question_id"].filter(key=>!bru.getVar(key));
        if(missing.length){bru.runner.skipRequest();}
    - type: after-response
      code: if(res.status===201 && res.body?.data?.id)bru.setVar("clone_id",res.body.data.id);
    - type: tests
      code: |-
        const body=res.getBody();
        test("HTTP 201 (actual "+res.getStatus()+" "+(body?.code||body?.status||"")+")",()=>{expect(res.getStatus()).to.equal(201);});
        test("response success flag",()=>expect(body.success).to.equal(true));
        test("response contract",()=>{expect(body.data.status).to.equal("DRAFT");});
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 201. Requires runtime variables: question_id. Run the collection sequentially with Local environment."
