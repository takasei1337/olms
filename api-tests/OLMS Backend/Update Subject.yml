info:
  name: Update Subject
  type: http
  seq: 33
  tags:
    - olms
    - positive
http:
  method: PATCH
  url: "{{base_url}}/subjects/{{subject_id}}"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "name": "Bruno {{run_id}} subject updated"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["subject_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: subject_id. Run the collection sequentially with Local environment."
