info:
  name: Override Pool Question
  type: http
  seq: 40
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/questions/{{pool_question_id}}/ai-override"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "reason": "Isolated Bruno fixture for deterministic matrix and variant regression"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing=["pool_question_id"].filter(key=>!bru.getVar(key));
        if(missing.length){bru.runner.skipRequest();}
    - type: tests
      code: |
        const body=res.getBody();
        test("HTTP 200 (actual "+res.getStatus()+" "+(body?.code||body?.status||"")+")",()=>{expect(res.getStatus()).to.equal(200);});
        test("response success flag",()=>expect(body.success).to.equal(true));
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: pool_question_id. Run the collection sequentially with Local environment."
