info:
  name: Cancel Exam
  type: http
  seq: 42

http:
  method: POST
  url: http://localhost:3000/api/v1/exams/:examId/cancel
  params:
    - name: examId
      value: 1011995d-3179-4667-8ee3-f6a2d6ff1ceb
      type: path
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "reason": "Kỳ thi bị hoãn theo quyết định của hội đồng khảo thí"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
