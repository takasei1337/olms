info:
  name: Generate Exam Variants
  type: http
  seq: 51
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/exams/{{exam_id}}/generate"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "variant_count": 2,
        "variant_code_start": "101",
        "strict_topic_balance": true,
        "similarity_threshold": 0.7
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["exam_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setVar("generated", true);
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 201 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(201);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.variants).to.have.lengthOf(2);
          expect(body.data.status).to.equal("GENERATED");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 201. Requires runtime variables: exam_id. Run the collection sequentially with Local environment."
