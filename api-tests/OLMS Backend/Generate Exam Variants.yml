info:
  name: Generate Exam Variants
  type: http
  seq: 29

http:
  method: POST
  url: http://localhost:3000/api/v1/exams/1011995d-3179-4667-8ee3-f6a2d6ff1ceb/generate
  body:
    type: json
    data: |-
      {
        "variant_count": 1,
        "variant_code_start": "101"
      }
  auth:
    type: bearer
    token: "{{process.env.OLMS_ACCESS_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
