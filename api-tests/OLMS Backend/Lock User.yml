info:
  name: Lock User
  type: http
  seq: 15
  tags:
    - olms
    - positive
http:
  method: PATCH
  url: "{{base_url}}/users/{{user_id}}/status"
  auth:
    type: bearer
    token: "{{admin_token}}"
  body:
    type: json
    data: |-
      {
        "status": "LOCKED"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["user_id","admin_token"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.status).to.equal("LOCKED");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: user_id, admin_token. Run the collection sequentially with Local environment."
