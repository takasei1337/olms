info:
  name: Student Cannot List Questions
  type: http
  seq: 168
  tags:
    - olms
    - negative
http:
  method: GET
  url: "{{base_url}}/questions"
  auth:
    type: bearer
    token: "{{student_token}}"
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["student_token"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 403 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(403);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(false);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 403. Requires runtime variables: student_token. Run the collection sequentially with Local environment."
