info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/v1/auth/login
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "Iroha1337@"
      }
  auth: inherit

vars:post-response:
  - name: token
    value: res.body.data.access_token

script:post-response: |-
  if (res.body && res.body.data && res.body.data.access_token) {
    bru.setVar('token', res.body.data.access_token);
  }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
