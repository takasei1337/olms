info:
  name: Set Exam Grading Rules
  type: http
  seq: 34

http:
  method: PUT
  url: http://localhost:3000/api/v1/exams/:examId/grading-rules
  params:
    - name: examId
      value: 1011995d-3179-4667-8ee3-f6a2d6ff1ceb
      type: path
  body:
    type: json
    data: |-
      {
        "rules": [
          {
            "question_type_id": "02dc896b-51c3-4add-a369-40c817c9f0f5",
            "scoring_mode": "EXACT_MATCH",
            "allow_negative_marking": false,
            "penalty_for_wrong": true,
            "case_sensitive": false,
            "rounding_precision": 2,
            "rounding_rule": "ROUND_HALF_UP"
          }
        ]
      }
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
