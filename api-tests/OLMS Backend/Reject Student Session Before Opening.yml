info:
  name: Reject Student Session Before Opening
  type: http
  seq: 180
  tags:
    - olms
    - negative
http:
  method: POST
  url: "{{base_url}}/me/exams/{{reuse_exam_id}}/session"
  auth:
    type: bearer
    token: "{{future_student_token}}"
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["reuse_exam_id","future_student_token"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 409 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(409);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(false);
        });

        test("response contract", () => {
          expect(body.code).to.equal("EXAM_NOT_OPEN");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 409. Requires runtime variables: reuse_exam_id, future_student_token. Run the collection sequentially with Local environment."
