info:
  name: Get Multi-Type Submission Result Detail
  type: http
  seq: 150
  tags:
    - olms
    - positive
http:
  method: GET
  url: "{{base_url}}/exams/{{mt_exam_id}}/results/{{mt_submission_id}}"
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["mt_exam_id","mt_submission_id","mt_ended"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.summary.total_score).to.equal(3.67);
          expect(body.data.summary.max_score).to.equal(4);
          const mc = body.data.answers.find((a) => a.render_spec?.kind === "MULTI_CHOICE");
          const dd = body.data.answers.find((a) => a.render_spec?.kind === "DROPDOWN");
          const inp = body.data.answers.find((a) => a.render_spec?.kind === "INPUT");
          const mat = body.data.answers.find((a) => a.render_spec?.kind === "MATCHING");
          expect(mc.grading_status).to.equal("PARTIAL");
          expect(mc.earned_score).to.equal(0.67);
          expect(dd.grading_status).to.equal("CORRECT");
          expect(dd.earned_score).to.equal(1);
          expect(inp.grading_status).to.equal("CORRECT");
          expect(inp.earned_score).to.equal(1);
          expect(mat.grading_status).to.equal("CORRECT");
          expect(mat.earned_score).to.equal(1);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: mt_exam_id, mt_submission_id, mt_ended. Run the collection sequentially with Local environment."
