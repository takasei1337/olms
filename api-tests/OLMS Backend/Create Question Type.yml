info:
  name: Create Question Type
  type: http
  seq: 25
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/question-types"
  auth:
    type: bearer
    token: "{{admin_token}}"
  body:
    type: json
    data: |-
      {
        "code": "{{run_id}}_TYPE",
        "name": "Bruno temporary type",
        "description": "Unused fixture for CRUD"
      }
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          const captured = res.body?.data?.["id"];
          if (captured) {
            bru.setVar("temporary_type_id", captured);
          }
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 201 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(201);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: Expected HTTP 201. Run the collection sequentially with Local environment.
