info:
  name: Generate Draft Root From Matrix
  type: http
  seq: 135
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/exams/{{mat_root_exam_id}}/root-questions/from-matrix"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "prevent_duplicate_topic": true
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["mat_root_exam_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("mat_root_drafted", true);
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.has_root_variant).to.equal(true);
          expect(body.data.variant_code).to.equal("ROOT");
          expect(body.data.items).to.have.lengthOf(2);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: mat_root_exam_id. Run the collection sequentially with Local environment."
