info:
  name: Create Cleanup Lesson
  type: http
  seq: 91
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/chapters/{{cleanup_chapter_id}}/lessons"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "code": "C1",
        "name": "Bruno cleanup lesson",
        "order_no": 1
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing=["cleanup_chapter_id"].filter(key=>!bru.getVar(key));
        if(missing.length){bru.runner.skipRequest();}
    - type: after-response
      code: if(res.status===201){const val=res.body?.data?.["id"];if(val)bru.setVar("cleanup_lesson_id",val);}
    - type: tests
      code: |
        const body=res.getBody();
        test("HTTP 201 (actual "+res.getStatus()+" "+(body?.code||body?.status||"")+")",()=>{expect(res.getStatus()).to.equal(201);});
        test("response success flag",()=>expect(body.success).to.equal(true));
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 201. Requires runtime variables: cleanup_chapter_id. Run the collection sequentially with Local environment."
