info:
  name: Login Admin
  type: http
  seq: 3
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "{{admin_username}}",
        "password": "{{admin_password}}"
      }
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const captured = res.body?.data?.["user"]?.["id"];
          if (captured) {
            bru.setVar("admin_user_id", captured);
          }
        }

        if (res.status === 200 && res.body?.data?.access_token) {
          bru.setVar("admin_token", res.body.data.access_token);
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.user.role).to.equal("ADMIN");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: Expected HTTP 200. Run the collection sequentially with Local environment.
