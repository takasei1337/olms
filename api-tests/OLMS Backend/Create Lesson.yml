info:
  name: Create Lesson
  type: http
  seq: 25

http:
  method: POST
  url: http://localhost:3000/api/v1/chapters/:chapterId/lessons
  params:
    - name: chapterId
      value: 7b952c7e-aa35-401c-8819-056f8aee78e7
      type: path
  body:
    type: json
    data: |-
      {
        "code": "LES_BRUNO_2816",
        "name": "Bài 1: Giới hạn của dãy số",
        "order_no": 1
      }
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
