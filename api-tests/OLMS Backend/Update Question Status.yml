info:
  name: Update Question Status
  type: http
  seq: 19

http:
  method: PATCH
  url: http://localhost:3000/api/v1/questions/c3e7b35f-62b5-4ff4-9274-4b400ba40798/status
  body:
    type: json
    data: |-
      {
        "status": "ACTIVE"
      }
  auth:
    type: bearer
    token: "{{process.env.OLMS_ACCESS_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
