info:
  name: Update Question Status
  type: http
  seq: 19

http:
  method: PATCH
  url: http://localhost:3000/api/v1/questions/:questionId/status
  params:
    - name: questionId
      value: 3efc4efc-a19b-4135-9cd9-bad26ca09101
      type: path
  body:
    type: json
    data: |-
      {
        "status": "ACTIVE"
      }
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

