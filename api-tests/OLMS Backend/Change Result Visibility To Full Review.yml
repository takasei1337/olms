info:
  name: Change Result Visibility To Full Review
  type: http
  seq: 88
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/exams/{{exam_id}}/results/visibility"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "result_visibility_mode": "FULL_REVIEW",
        "reason": "Publish full answer key and explanations for student review"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing=["exam_id","results_published"].filter(key=>!bru.getVar(key));
        if(missing.length){bru.runner.skipRequest();}
    - type: tests
      code: |-
        const body=res.getBody();
        test("HTTP 200 (actual "+res.getStatus()+" "+(body?.code||body?.status||"")+")",()=>{expect(res.getStatus()).to.equal(200);});
        test("response success flag",()=>expect(body.success).to.equal(true));
        test("response contract",()=>{expect(body.data.result_visibility_mode).to.equal("FULL_REVIEW");});
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: exam_id, results_published. Run the collection sequentially with Local environment."
