info:
  name: Export Print Files
  type: http
  seq: 111
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/exams/{{exam_id}}/print-files"
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["exam_id","generated"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.download_url).to.be.a("string");
          expect(body.data.file_name).to.include(".zip");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: exam_id, generated. Known limitation: PLACEHOLDER. Run the collection sequentially with Local environment."
