info:
  name: Export Print Files
  type: http
  seq: 113
  tags:
    - olms
    - negative
http:
  method: POST
  url: "{{base_url}}/exams/{{exam_id}}/print-files"
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["exam_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 501 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(501);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(false);
        });

        test("response contract", () => {
          expect(body.code).to.equal("NOT_IMPLEMENTED");
          expect(body.data).to.equal(null);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 501. Requires runtime variables: exam_id. Run the collection sequentially with Local environment."
