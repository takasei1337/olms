info:
  name: Student Review Full
  type: http
  seq: 105
  tags:
    - olms
    - positive
http:
  method: GET
  url: "{{base_url}}/me/results/{{exam_id}}/review"
  auth:
    type: bearer
    token: "{{enrolled_student_token}}"
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["enrolled_student_token","exam_id","results_published"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.answers[0].correct_answer).to.be.an("object");
          expect(body.data.answers[0].explanation).to.be.a("string");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: enrolled_student_token, exam_id, results_published. Run the collection sequentially with Local environment."
