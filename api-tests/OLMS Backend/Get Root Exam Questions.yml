info:
  name: Get Root Exam Questions
  type: http
  seq: 130
  tags:
    - olms
    - positive
http:
  method: GET
  url: "{{base_url}}/exams/{{root_exam_id}}/root-questions"
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["root_exam_id","root_questions_set"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.has_root_variant).to.equal(true);
          expect(body.data.variant_code).to.equal("ROOT");
          expect(body.data.items).to.have.lengthOf(2);
          expect(body.data.items[0].question_id).to.equal(bru.getVar("pool_question_id"));
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: root_exam_id, root_questions_set. Run the collection sequentially with Local environment."
