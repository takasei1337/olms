info:
  name: Verify Changed Password
  type: http
  seq: 13
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "{{run_id}}_user",
        "password": "{{api_user_new_password}}"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["user_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.data?.access_token) {
          bru.setVar("changed_password_token", res.body.data.access_token);
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: user_id. Run the collection sequentially with Local environment."
