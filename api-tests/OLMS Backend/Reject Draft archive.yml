info:
  name: Reject Draft archive
  type: http
  seq: 86
  tags:
    - olms
    - negative
http:
  method: POST
  url: "{{base_url}}/exams/{{delete_exam_id}}/archive"
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing=["delete_exam_id"].filter(key=>!bru.getVar(key));
        if(missing.length){bru.runner.skipRequest();}
    - type: tests
      code: |
        const body=res.getBody();
        test("HTTP 409 (actual "+res.getStatus()+" "+(body?.code||body?.status||"")+")",()=>{expect(res.getStatus()).to.equal(409);});
        test("response success flag",()=>expect(body.success).to.equal(false));
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 409. Requires runtime variables: delete_exam_id. Run the collection sequentially with Local environment."
