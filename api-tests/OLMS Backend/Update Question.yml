info:
  name: Update Question
  type: http
  seq: 31
  tags:
    - olms
    - positive
http:
  method: PATCH
  url: "{{base_url}}/questions/{{question_id}}"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "content": "Bruno {{run_id}} CRUD updated: 2 + 3 bằng bao nhiêu?",
        "explanation": "Updated explanation"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["question_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.content).to.include("updated");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: question_id. Run the collection sequentially with Local environment."
