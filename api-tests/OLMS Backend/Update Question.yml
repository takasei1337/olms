info:
  name: Update Question
  type: http
  seq: 18

http:
  method: PATCH
  url: http://localhost:3000/api/v1/questions/:questionId
  params:
    - name: questionId
      value: 3efc4efc-a19b-4135-9cd9-bad26ca09101
      type: path
  body:
    type: json
    data: |-
      {
        "content": "Kết quả của biểu thức 2 + 3 là?",
        "difficulty_level": "EASY"
      }
