info:
  name: Create Subject
  type: http
  seq: 11

http:
  method: POST
  url: http://localhost:3000/api/v1/subjects
  body:
    type: json
    data: |-
      {
        "code": "SUB_BRUNO_01",
        "name": "Môn học kiểm thử Bruno",
        "description": "Dữ liệu kiểm thử tự động Bruno"
      }
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
