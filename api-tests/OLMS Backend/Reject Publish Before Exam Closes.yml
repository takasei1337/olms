info:
  name: Reject Publish Before Exam Closes
  type: http
  seq: 93
  tags:
    - olms
    - negative
http:
  method: POST
  url: "{{base_url}}/exams/{{exam_id}}/results/publish"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "result_visibility_mode": "SCORE_ONLY"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["exam_id","started"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 409 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(409);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(false);
        });

        test("response contract", () => {
          expect(body.code).to.equal("INVALID_EXAM_STATUS");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 409. Requires runtime variables: exam_id, started. Run the collection sequentially with Local environment."
