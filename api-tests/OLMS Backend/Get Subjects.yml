info:
  name: Get Subjects
  type: http
  seq: 10

http:
  method: GET
  url: http://localhost:3000/api/v1/subjects
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
