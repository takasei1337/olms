  url: http://localhost:3000/api/v1/subjects/:subjectId/chapters
  params:
    - name: subjectId
      value: d1d03215-0882-46fa-a112-e0d9725a3882
      type: path
  body:
    type: json
    data: |-
      {
        "code": "CH_BRUNO_2810",
        "name": "Chương 1: Giới hạn và Hàm số",
        "order_no": 1
