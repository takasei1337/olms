info:
  name: Get Lessons
  type: http
  seq: 21
  tags:
    - olms
    - positive
http:
  method: GET
  url: "{{base_url}}/chapters/{{chapter_id}}/lessons"
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing=["chapter_id"].filter(key=>!bru.getVar(key));
        if(missing.length){bru.runner.skipRequest();}
    - type: tests
      code: |-
        const body=res.getBody();
        test("HTTP 200 (actual "+res.getStatus()+" "+(body?.code||body?.status||"")+")",()=>{expect(res.getStatus()).to.equal(200);});
        test("response success flag",()=>expect(body.success).to.equal(true));
        test("response contract",()=>{expect(body.data).to.be.an("array");});
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: chapter_id. Run the collection sequentially with Local environment."
