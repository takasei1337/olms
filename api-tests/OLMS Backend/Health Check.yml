info:
  name: Health Check
  type: http
  seq: 1
  tags:
    - olms
    - positive
http:
  method: GET
  url: "{{root_url}}/health"
runtime:
  scripts:
    - type: before-request
      code: |-
        const runtimeKeys = [
          "admin_user_id",
          "admin_token",
          "token",
          "user_id",
          "password_token",
          "changed_password_token",
          "subject_id",
          "chapter_id",
          "lesson_id",
          "temporary_type_id",
          "question_id",
          "clone_id",
          "pool_question_id",
          "exam_id",
          "main_preview_token",
          "generated",
          "published",
          "participant_id",
          "import_token",
          "sv02_participant_id",
          "started",
          "enrolled_student_token",
          "sv02_username",
          "sv02_password",
          "submission_id",
          "evq_id",
          "submit_token",
          "submit_token_conflict",
          "student_token",
          "results_published",
          "cancel_exam_id",
          "delete_exam_id",
          "pool_sim_question_id",
          "topic_b_question_id",
          "sem_exam_id",
          "reuse_exam_id",
          "reuse_generated",
          "root_exam_id",
          "root_questions_set",
          "root_rules_set",
          "mat_root_exam_id",
          "mat_root_drafted",
          "mt_multi_q_id",
          "multi_choice_type_id",
          "mt_dropdown_q_id",
          "dropdown_type_id",
          "mt_input_q_id",
          "input_type_id",
          "mt_matching_q_id",
          "matching_type_id",
          "mt_exam_id",
          "mt_generated",
          "mt_published",
          "sv03_participant_id",
          "mt_started",
          "mt_student_token",
          "sv03_username",
          "sv03_password",
          "mt_submission_id",
          "mt_multi_evq_id",
          "mt_mc_opt_1",
          "mt_mc_opt_2",
          "mt_dropdown_evq_id",
          "mt_input_evq_id",
          "mt_matching_evq_id",
          "cleanup_subject_id",
          "cleanup_chapter_id",
          "cleanup_lesson_id",
          "future_published",
          "future_student_token",
          "future_username",
          "future_password",
          "other_teacher_token"
        ];
        runtimeKeys.forEach((key) => bru.deleteVar(key));
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response contract", () => {
          expect(body.status).to.equal("ok");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: Expected HTTP 200. Run the collection sequentially with Local environment.
