info:
  name: Commit Participant Import
  type: http
  seq: 75
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/exams/{{exam_id}}/participants/import/commit"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "import_token": "{{import_token}}"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["exam_id","import_token"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 201 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(201);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.created_count).to.equal(1);
          expect(body.data.invalid_count).to.equal(1);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 201. Requires runtime variables: exam_id, import_token. Run the collection sequentially with Local environment."
