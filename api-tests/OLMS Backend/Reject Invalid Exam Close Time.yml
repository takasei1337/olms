info:
  name: Reject Invalid Exam Close Time
  type: http
  seq: 97
  tags:
    - olms
    - negative
http:
  method: PATCH
  url: "{{base_url}}/exams/{{exam_id}}/close-time"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "closes_at": "{{already_open_at}}",
        "reason": "Bruno regression test invalid close time"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["exam_id","started"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 400 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(400);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(false);
        });

        test("response contract", () => {
          expect(body.code).to.equal("INVALID_CLOSE_TIME");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 400. Requires runtime variables: exam_id, started. Run the collection sequentially with Local environment."
