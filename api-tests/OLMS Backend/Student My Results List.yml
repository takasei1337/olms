info:
  name: Student My Results List
  type: http
  seq: 101
  tags:
    - olms
    - positive
http:
  method: GET
  url: "{{base_url}}/me/results"
  auth:
    type: bearer
    token: "{{student_token}}"
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["student_token","results_published"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          const targetId = bru.getEnvVar("publish_ready_exam_id");
          const item = body.data.find((entry) => entry.exam_id === targetId);
          expect(item).to.be.an("object");
          expect(item.result_available).to.equal(true);
          expect(item.total_score).to.be.a("number");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: student_token, results_published. Run the collection sequentially with Local environment."
