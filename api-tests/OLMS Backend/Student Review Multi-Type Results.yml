info:
  name: Student Review Multi-Type Results
  type: http
  seq: 152
  tags:
    - olms
    - positive
http:
  method: GET
  url: "{{base_url}}/me/results/{{mt_exam_id}}/review"
  auth:
    type: bearer
    token: "{{mt_student_token}}"
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["mt_student_token","mt_exam_id","mt_results_published"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.summary.total_score).to.equal(3.67);
          expect(body.data.answers).to.have.lengthOf(4);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: mt_student_token, mt_exam_id, mt_results_published. Run the collection sequentially with Local environment."
