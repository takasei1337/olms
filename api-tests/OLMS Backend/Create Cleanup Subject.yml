info:
  name: Create Cleanup Subject
  type: http
  seq: 89
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/subjects"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "code": "{{run_id}}_C",
        "name": "Bruno cleanup subject"
      }
runtime:
  scripts:
    - type: after-response
      code: if(res.status===201){const val=res.body?.data?.["id"];if(val)bru.setVar("cleanup_subject_id",val);}
    - type: tests
      code: |
        const body=res.getBody();
        test("HTTP 201 (actual "+res.getStatus()+" "+(body?.code||body?.status||"")+")",()=>{expect(res.getStatus()).to.equal(201);});
        test("response success flag",()=>expect(body.success).to.equal(true));
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: Expected HTTP 201. Run the collection sequentially with Local environment.
