info:
  name: Get Exams
  type: http
  seq: 30

http:
  method: GET
  url: http://localhost:3000/api/v1/exams
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query
    - name: status
      value: "DRAFT"
      type: query
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
