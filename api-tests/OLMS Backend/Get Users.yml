info:
  name: Get Users
  type: http
  seq: 6

http:
  method: GET
  url: http://localhost:3000/api/v1/users?page=1&page_size=100
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "100"
      type: query
  auth:
    type: bearer
    token: "{{process.env.OLMS_ACCESS_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
