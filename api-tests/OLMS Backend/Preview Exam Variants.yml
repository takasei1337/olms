info:
  name: Preview Exam Variants
  type: http
  seq: 67
  tags:
    - olms
    - positive
http:
  method: POST
  url: "{{base_url}}/exams/{{exam_id}}/generate"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "variant_count": 2,
        "variant_code_start": "101",
        "strict_topic_balance": true,
        "preview_only": true
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["exam_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        if (res.status === 200) {
          const captured = res.body?.data?.["review_token"];
          if (captured) {
            bru.setVar("main_preview_token", captured);
          }
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data.review_required).to.equal(false);
          expect(body.data.variant_code).to.equal("ROOT");
          expect(body.data.is_root).to.equal(true);
          expect(body.data.questions).to.have.lengthOf(1);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: exam_id. Run the collection sequentially with Local environment."
