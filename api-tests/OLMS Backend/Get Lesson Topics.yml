info:
  name: Get Lesson Topics
  type: http
  seq: 119
  tags:
    - olms
    - positive
http:
  method: GET
  url: "{{base_url}}/lessons/{{lesson_id}}/topics"
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const missing = ["lesson_id","topic_b_question_id"].filter((key) => !bru.getVar(key));
        if (missing.length) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("HTTP 200 (actual " + res.getStatus() + " " + (body?.code || body?.status || "") + ")", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response success flag", () => {
          expect(body.success).to.equal(true);
        });

        test("response contract", () => {
          expect(body.data).to.be.an("array");
          expect(body.data.length).to.be.greaterThan(1);
          expect(body.data.some((t) => String(t.topic_tag).endsWith("_TOPIC_B"))).to.equal(true);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
docs: "Expected HTTP 200. Requires runtime variables: lesson_id, topic_b_question_id. Run the collection sequentially with Local environment."
