          DROPDOWN: '#/components/schemas/AnswerUpsertDROPDOWN'
          INPUT: '#/components/schemas/AnswerUpsertINPUT'
          MATCHING: '#/components/schemas/AnswerUpsertMATCHING'
      example:
        response_kind: SINGLE_CHOICE
        client_sequence: 9
        expected_client_sequence: 8
        edit_token: 0199ac14-a9bc-7001-8000-000000000077
        selected_options:
