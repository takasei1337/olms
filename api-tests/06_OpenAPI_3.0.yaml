paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Đăng nhập và cấp Access Token
      operationId: post_auth_login
      description: "Refresh Token được set vào HttpOnly+Secure Cookie, không đưa vào JSON.\n\nVai trò: Public. Các URI/payload
        là hợp đồng thiết kế đề xuất dựa trên SRS+CSDL+SAD/HLD, không phải endpoint sẵn có."
      x-roles:
        - Public
      x-use-case: Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginData'
              example:
                success: true
                code: SUCCESS
                message: Thành công
                data:
                  access_token: eyJhbGciOi...
                  token_type: Bearer
                  expires_in: 1200
                  user:
                    id: 0199ac14-a9bc-7001-8000-000000000001
                    username: teacher01
                    full_name: Giáo viên A
                    role: TEACHER
                    status: ACTIVE
                meta:
                timestamp: '2026-10-10T01:15:12Z'
                trace_id: req_01HW0Y6RP5
          headers:
            Set-Cookie:
              description: olms_refresh=...; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Gia hạn Access Token bằng cookie
      operationId: post_auth_refresh
      description: "Yêu cầu Cookie olms_refresh; bảo vệ CSRF cho endpoint dùng cookie.\n\nVai trò: Cookie. Các URI/payload
