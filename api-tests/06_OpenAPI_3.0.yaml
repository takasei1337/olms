    AnswerUpsertRequest:
      description: 'ARC-01 optimistic CAS: client_sequence=expected_client_sequence+1 per question; edit_token stable across
        retries; 409 when another tab/device has advanced revision. ARC-02 deadline and saved local edits are not evidence
        of server acceptance.'
      oneOf:
        - $ref: '#/components/schemas/AnswerUpsertSINGLE_CHOICE'
        - $ref: '#/components/schemas/AnswerUpsertMULTI_CHOICE'
        - $ref: '#/components/schemas/AnswerUpsertDROPDOWN'
