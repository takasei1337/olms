      summary: Autosave câu trả lời với client_sequence tăng dần
      operationId: put_me_submissions__submissionId__answers__variantQuestionId
      description: "So sánh sequence theo từng câu; khi request cũ, trả 409, không ghi đè.\n\nVai trò: STUDENT. Các URI/payload
        là hợp đồng thiết kế đề xuất dựa trên SRS+CSDL+SAD/HLD, không phải endpoint sẵn có. P-04: chỉ commit khi server_time
        < min(submission.started_at+duration, exam.closes_at). Tại hoặc sau deadline trả 403 SESSION_EXPIRED; không đồng bộ
        đáp án IndexedDB chưa ACK sau hạn. P-04 linearization: SELECT submissions FOR UPDATE, then clock_timestamp() < deadline_at
        check. Queued request reaching DB lock after deadline is rejected; valid write checked before deadline may ACK after
        deadline.\nP-06: response_kind discriminator, per-type oneOf. Reject cross-kind payload or unknown stable IDs.\nARC-01:
        authorize participant owner, serialize on submission row, require expected_client_sequence+edit_token; accept only
        if revision matches; 409 includes user-owned SavedAnswer. Offline drafts after deadline are never accepted. No answer
        key returned. DB function olms_autosave_online_cas.\nSecurity: derive STUDENT identity from JWT; prevent IDOR; Cache-Control:
        private, no-store for sensitive data."
      x-roles:
        - STUDENT
      x-use-case: StudentExam
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: string
