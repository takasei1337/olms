openapi: 3.0.3
info:
  title: OLMS — Backend REST API Contract
  version: 1.0.1-design
  x-olms-release-audit:
    date: '2026-10-13'
    status: design-contract-not-deployed
    database-target: PostgreSQL 18+
    migrations-for-legacy: V001-V005
    manual-submit-deadline: before min(started_at + duration, closes_at)
    offline-unsynced-after-deadline: rejected
    validation: static-only
  description: "Hợp đồng API đề xuất cho hệ thống OLMS. Nguồn: SRS (8 Use Case, security, scoring), ThietKe_CSDL_OLMS PostgreSQL
    23 bảng, SAD/HLD OLMS 10/10/2026 (quyết định A-01..A-05).\nQuy tắc ưu tiên: SRS nghiệp vụ → SAD/HLD (giải quyết xung đột
    và thay đổi schema đích) → CSDL cho tên trường. Không nhầm API Contract này là endpoint đã triển khai.\nKhông tiết lộ
    đáp án chuẩn trong phiên thi; status máy chủ là nguồn chân lý. P-03/P-04 chốt ngày 13/10/2026. Các quyết định còn chờ
    khác được mô tả trong tài liệu đi kèm.\nP-05/P-06 (13/10/2026): kiểm soát hiển thị kết quả backend, canonical JSON v1
    cho 5 loại câu hỏi. API design release, chưa khẳng định triển khai.\nP-07: ảnh scan staged theo exam_id trước khi biết
    participant. P-08: một bộ exams.status canonical; cần migration DB trước khi triển khai. Đây là hợp đồng đề xuất, không
    phải API đã chạy.\nARC-01..ARC-03 / API-01..API-03: hợp đồng thiết kế phiên bản 1.0.0, chưa chứng minh triển khai. Tương
    thích sau DB V004.\n\nQA Phase4: baseline 82 operations; QA fixtures and environment scaffolding do not represent Backend
    deployed. P-01 credential export is password-free.\n\nRevision 1.0.1-design: CAS retry sau deadline chỉ trả ACK bản ghi
    đã COMMIT; P-01 xác nhận PO còn chờ. Contract phục vụ bắt đầu code, chưa có backend production."
  contact:
    name: Nhóm OLMS Backend & Frontend
  x-db-phase2:
    version: DB-01..DB-07 / 2026-10-13
    reference_ddl: OLMS_P08_Canonical_DDL/00_apply_fresh.sql
    migration_path: OLMS_Versioned_Migrations/V20261013_001_to_003
    source_of_time: PostgreSQL clock_timestamp after submission row lock
    idempotency: submission submit_token immutable and unique
    note: Contract only; PostgreSQL migration and QA execution are deployment gates.
  x-decisions:
    P-05: HIDDEN absolute; other modes after final Grade; Teacher owner audited change after RESULT_PUBLISHED
    P-06: Canonical answer_spec schema_version 1; oneOf for 5 types; snapshot frozen
  x-contract-phase: IMPLEMENTATION_BASELINE_NOT_RUNTIME_VERIFIED
  x-po-approval: P01_PENDING_PO_SIGNOFF
servers:
  - url: http://localhost:8080/api/v1
    description: Local development — thay theo môi trường triển khai
tags:
  - name: Auth
    description: UC-06 — Xác thực & phiên
  - name: Users
    description: UC-05 — Quản lý người dùng
  - name: Catalog
    description: UC-02 — Cây kiến thức & dạng câu hỏi
  - name: Questions
    description: UC-02 — Ngân hàng câu hỏi & AI
  - name: Exams
    description: UC-04 — Kỳ thi, ma trận, mã đề
  - name: Participants
    description: UC-03 — Thí sinh dự thi
  - name: StudentExam
    description: UC-07 — Thi trực tuyến
  - name: Results
    description: UC-01/08 — Kết quả
  - name: OMR
    description: UC-01 — Phiếu giấy/OMR
  - name: Audit
    description: SRS 5.3 — Nhật ký
security:
